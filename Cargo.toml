[workspace]
members = ["crates/core", "crates/ddeck"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deeplabua/deepdeck"
homepage = "https://github.com/deeplabua/deepdeck"
authors = ["DeepLab"]

[workspace.dependencies]
deepdeck-core = { version = "0.7.0", path = "crates/core" }

# All dependencies must be permissive (MIT / Apache-2.0 / BSD / MPL / Zlib).
# No GPL/AGPL, no network clients, no async runtime.
anyhow = "1.0"                                          # MIT OR Apache-2.0
clap = { version = "4.5", features = ["derive"] }       # MIT OR Apache-2.0
jiff = { version = "0.2", features = ["serde"] }                                          # Unlicense OR MIT
serde = { version = "1.0", features = ["derive"] }      # MIT OR Apache-2.0
# preserve_order keeps the user's key order when we rewrite ~/.claude/settings.json.
serde_json = { version = "1.0", features = ["preserve_order"] }  # MIT OR Apache-2.0
# TUI. crossterm (MIT) comes through ratatui's re-export, pinned to 0.29.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }  # MIT
# Display width of Cyrillic, CJK and symbols in the narrow panel.
unicode-width = "0.2"                                   # MIT OR Apache-2.0
# Line diff for `ddeck install --dry-run`.
similar = "2.7"                                         # Apache-2.0
thiserror = "2.0"                                       # MIT OR Apache-2.0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "deeplabua/homebrew-tap"
# Publish jobs to run in CI. `./publish-crates` is the local reusable workflow
# `.github/workflows/publish-crates.yml` (crates.io publish; needs the
# CARGO_REGISTRY_TOKEN repo secret).
publish-jobs = ["homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax).
# Windows builds and passes CI, but hooks under Claude Code on Windows are not
# yet tried by hand.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in. Hooks in ~/.claude/settings.json
# call the binary by its full path; `ddeck doctor` notices when it moved.
install-path = "CARGO_HOME"

# macOS 14 runner images are retired on 2 November 2026 (brownouts before that).
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
