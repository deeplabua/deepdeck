# Custom cargo-dist publish job: push the workspace crates to crates.io.
#
# Wired in via `publish-jobs = ["./publish-crates"]` in Cargo.toml's
# `[workspace.metadata.dist]`; cargo-dist calls this reusable workflow in the
# publish stage (after the GitHub Release is created) with `secrets: inherit`,
# so `CARGO_REGISTRY_TOKEN` (a repo secret) is available here.
#
# crates.io has no atomic multi-crate publish, so the members go up in
# dependency order — deepdeck-core first, then the deepdeck binary.
name: Publish to crates.io

on:
  workflow_call:
    # cargo-dist passes the plan; we don't read it, but the input must be declared.
    inputs:
      plan:
        required: true
        type: string
  # Allow a manual re-run from the Actions tab if a publish half-fails.
  workflow_dispatch:

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Publish deepdeck-core
        run: cargo publish -p deepdeck-core
      - name: Publish deepdeck
        run: cargo publish -p deepdeck
